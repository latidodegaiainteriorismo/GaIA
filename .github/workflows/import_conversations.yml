name: Import Conversations

on:
  push:
    branches: [main]
    paths:
      - 'conversations_import/raw/**'
      - '!conversations_import/raw/done/**'
  workflow_dispatch:
    inputs:
      user_id:
        description: 'UUID del usuario destino (déjalo vacío para usar el por defecto)'
        required: false
        type: string

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesario para hacer commit del movimiento a raw/done/

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install psycopg2-binary groq pypdf

      - name: Procesar e importar conversaciones
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GAIA_IMPORT_USER_ID: ${{ inputs.user_id }}
        run: python scripts/parse_and_import_conversations.py

      - name: Confirmar los ficheros movidos a done/
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Importar conversaciones: mover ficheros procesados a raw/done/"
          file_pattern: 'conversations_import/raw/**'
