name: Tests

# Se ejecuta en cada push y pull request. Existe porque el 28-ago-2026 una
# edición desde la web de GitHub sustituyó routes/chat.py por una versión
# antigua y GaIA estuvo dos meses sin ver los mensajes recientes ni usar la
# memoria, sin que nada avisara. Estas pruebas habrían fallado en rojo ese día.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'knowledge/**'
      - 'conversations_import/**'
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependencias
        # fastembed (ONNX) solo se importa de forma diferida en /ingest; no hace falta aquí
        run: |
          grep -v '^fastembed' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt pytest
      - name: Pruebas
        run: python -m pytest tests -q
